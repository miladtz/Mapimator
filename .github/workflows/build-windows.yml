name: Build MapMotion Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build current-user Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up stable Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download pinned FFmpeg resource
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip'
          $sha256 = 'b3a6a580b961bd7aa175cdfc4bfcf010f033943968e9e1f5f4cf4d7f03164713'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Downloaded FFmpeg SHA-256: $actualSha256"
          if ($actualSha256 -ne $sha256) { throw "FFmpeg checksum verification failed. Expected $sha256, received $actualSha256." }
          $destination = 'src-tauri/resources/ffmpeg'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Get-ChildItem $env:RUNNER_TEMP -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item (Join-Path $bin.FullName '*') $destination -Force

      - name: Validate bundled FFmpeg encoder
        shell: pwsh
        run: |
          $ffmpeg = 'src-tauri/resources/ffmpeg/ffmpeg.exe'
          if (-not (Test-Path $ffmpeg)) { throw 'Bundled ffmpeg.exe was not extracted.' }
          $hasX264 = (& $ffmpeg -hide_banner -encoders | Select-String 'libx264' -Quiet)
          if ($LASTEXITCODE -ne 0 -or -not $hasX264) { throw 'Bundled FFmpeg does not provide the required libx264 encoder.' }

      - name: Build Tauri Windows bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --bundles nsis

      - name: Confirm expected artifacts exist
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue
          $application = Get-Item 'src-tauri/target/release/mapmotion-studio.exe' -ErrorAction SilentlyContinue
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          if (-not $application) { throw 'Standalone application executable was not generated.' }

      - name: Assemble portable application folder
        shell: pwsh
        run: |
          $portable = 'dist-portable/MapMotion Studio'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item 'src-tauri/target/release/mapmotion-studio.exe' $portable -Force
          Copy-Item 'src-tauri/target/release/resources' (Join-Path $portable 'resources') -Recurse -Force

      - name: Upload MapMotion Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapMotion-Windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/mapmotion-studio.exe
            src-tauri/target/release/resources/**
            dist-portable/**
            src-tauri/tauri.conf.json
