name: Build MapMotion Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build current-user Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up stable Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri Windows bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --bundles nsis

      - name: Confirm expected artifacts exist
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue
          $application = Get-Item 'src-tauri/target/release/mapmotion-studio.exe' -ErrorAction SilentlyContinue
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          if (-not $application) { throw 'Standalone application executable was not generated.' }

      - name: Upload MapMotion Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapMotion-Windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/mapmotion-studio.exe
            src-tauri/tauri.conf.json
